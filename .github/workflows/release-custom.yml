name: Grid custom release

on:
  push:
    branches: [my-custom-release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grid-custom-release
  cancel-in-progress: false

jobs:
  version:
    if: github.repository == 'JeongEEE/gridcraft' && github.ref == 'refs/heads/my-custom-release'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re, tomllib
          version = tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"]
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit("Grid releases require a numeric X.Y.Z version")
          print(f"version={version}")
          PY
      - name: Refuse to overwrite a published version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "gridcraft-v$VERSION" --json isDraft --jq '.isDraft' > /tmp/grid-release-state; then
            test "$(cat /tmp/grid-release-state)" = true || {
              echo 'This version is published. Bump Cargo.toml before releasing again.' >&2
              exit 1
            }
          fi

  macos:
    needs: version
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
      CRAFT_FONTS_REQUIRED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out pinned release fonts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: b076417b5880bd4154bd22f00695b1d28c6bea83
          path: craft-fonts
          persist-credentials: false
      - uses: step-security/dtolnay-rust-toolchain@8dd607977d06adf4ed49b190381e74c17a9dd25f # v1.0.0
        with:
          toolchain: 1.95.0
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: step-security/rust-cache@8871c8ba063416da7c32246932ea6ae08700453e # v2.9.2
        with:
          key: grid-macos-universal
      - name: Verify install identity
        run: python3 packaging/test_fork_contract.py
      - name: Test authenticated updater
        run: cargo test --locked -p gridcraft-update
      - name: Build universal app and DMG
        run: packaging/macos/package.sh --arch universal
      - name: Verify native bundle update and rollback
        env:
          GRID_UPDATE_SMOKE_PACKAGE: ${{ github.workspace }}/dist/release/grid-${{ needs.version.outputs.version }}-macos-universal.dmg
        run: cargo test --locked -p gridcraft-update --lib native_dmg_roundtrip -- --ignored
      - name: Smoke test CLI
        shell: bash
        run: |
          set -euo pipefail
          cli=target/macos-package/bin/gridcraft-cli
          test "$("$cli" eval '=SUM(1,2,3)')" = 6
          "$cli" run --sample budget --out /tmp/grid-budget.xlsx
          "$cli" cat /tmp/grid-budget.xlsx --range B4:F8
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grid-macos
          path: dist/release/*
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
      CRAFT_FONTS_REQUIRED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out pinned release fonts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: b076417b5880bd4154bd22f00695b1d28c6bea83
          path: craft-fonts
          persist-credentials: false
      - uses: step-security/dtolnay-rust-toolchain@8dd607977d06adf4ed49b190381e74c17a9dd25f # v1.0.0
        with:
          toolchain: 1.95.0
          targets: x86_64-pc-windows-msvc
      - uses: step-security/rust-cache@8871c8ba063416da7c32246932ea6ae08700453e # v2.9.2
        with:
          key: grid-windows-x64
      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed' }
      - name: Verify install identity
        run: python packaging/test_fork_contract.py
      - name: Test authenticated updater
        run: cargo test --locked -p gridcraft-update
      - name: Build MSI and portable ZIP
        shell: pwsh
        run: ./packaging/windows/package.ps1 -Arch x64
      - name: Install and remove Grid in the isolated runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((Test-Path 'HKCU:\Software\Grid') -or (Test-Path 'HKLM:\Software\Grid')) {
            throw 'Expected a clean runner without a Grid installation'
          }
          $msi = (Get-ChildItem dist/release/*.msi).FullName
          $folder = Join-Path $env:RUNNER_TEMP 'GridInstall'
          $log = Join-Path $env:RUNNER_TEMP 'grid-install.log'
          $installed = $false
          function Invoke-Installer([string] $Arguments) {
            $process = Start-Process msiexec.exe -ArgumentList $Arguments -PassThru
            if (-not $process.WaitForExit(120000)) { $process.Kill(); throw 'Installer timed out' }
            if ($process.ExitCode -ne 0) {
              if (Test-Path $log) { Get-Content $log -Tail 60 }
              throw "Installer exited $($process.ExitCode)"
            }
          }
          try {
            Invoke-Installer "/i `"$msi`" INSTALLFOLDER=`"$folder`" ALLUSERS=2 MSIINSTALLPERUSER=1 /qn /norestart /l*v `"$log`""
            $installed = $true
            foreach ($file in 'grid.exe', 'grid-cli.exe', 'LICENSE-MIT', 'LICENSE-APACHE') {
              if (-not (Test-Path (Join-Path $folder $file))) { throw "Missing installed file: $file" }
            }
            if ((& (Join-Path $folder 'grid-cli.exe') eval '=SUM(1,2,3)') -ne '6') { throw 'Installed CLI failed' }
          } finally {
            if ($installed) { Invoke-Installer "/x `"$msi`" /qn /norestart /l*v `"$log`"" }
          }
      - name: Verify native MSI upgrade and portable rollback
        shell: pwsh
        run: |
          ./packaging/windows/test-auto-update.ps1 -Msi (Get-ChildItem dist/release/*.msi).FullName
          $env:GRID_UPDATE_SMOKE_PACKAGE = (Get-ChildItem dist/release/*-portable.zip).FullName
          cargo test --locked -p gridcraft-update --lib native_windows_portable_roundtrip -- --ignored
          if ($LASTEXITCODE -ne 0) { throw 'Portable update regression failed' }
      - name: Smoke test CLI and portable layout
        shell: pwsh
        run: |
          $cli = 'target/windows-package/x64/grid-cli.exe'
          if ((& $cli eval '=SUM(1,2,3)') -ne '6') { throw 'Formula evaluation failed' }
          & $cli run --sample budget --out "$env:RUNNER_TEMP/grid-budget.xlsx"
          if ($LASTEXITCODE -ne 0) { throw 'XLSX save failed' }
          & $cli cat "$env:RUNNER_TEMP/grid-budget.xlsx" --range B4:F8
          if ($LASTEXITCODE -ne 0) { throw 'XLSX reopen failed' }
          $zip = Get-ChildItem dist/release/*-portable.zip
          Expand-Archive $zip.FullName "$env:RUNNER_TEMP/grid-portable"
          if (-not (Get-ChildItem "$env:RUNNER_TEMP/grid-portable" -Recurse -Filter grid.exe)) { throw 'Missing Grid executable' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grid-windows
          path: dist/release/*
          if-no-files-found: error

  draft:
    needs: [version, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: step-security/dtolnay-rust-toolchain@8dd607977d06adf4ed49b190381e74c17a9dd25f # v1.0.0
        with:
          toolchain: 1.95.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: grid-*
          merge-multiple: true
          path: release
      - name: Sign the fork update manifest
        env:
          GRID_UPDATE_PRIVATE_KEY: ${{ secrets.GRID_UPDATE_PRIVATE_KEY }}
        run: cargo run --locked -p gridcraft-update --bin grid-update-sign -- sign release "$VERSION" crates/update/public-key.hex
      - name: Create checksums and a draft only
        shell: bash
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd release
          test -f "grid-$VERSION-macos-universal.dmg"
          test -f "grid-cli-$VERSION-macos-universal.zip"
          test -f "grid-$VERSION-windows-x64.msi"
          test -f "grid-$VERSION-windows-x64-portable.zip"
          sha256sum *.dmg *.msi *.zip GridUpdate.json GridUpdate.sig > SHA256SUMS.txt
          cat > /tmp/grid-release-notes.md <<'NOTES'
          Grid is a personal fork of GridCraft for Windows and macOS.

          macOS: download the universal DMG. Windows: download the x64 MSI or portable ZIP.
          Grid automatically downloads fork updates and verifies the pinned Grid release signature.
          Choose Restart to Update when ready; unsaved documents are checked before quitting.
          macOS bundles and Windows portable files roll back if replacement or startup fails.
          MSI copies keep their installation scope and folder; machine installs may request permission.
          OS code signing/notarization is separate: these builds are not notarized/Authenticode-signed.
          Install this updater-enabled version once manually to receive subsequent automatic updates.

          Korean cell entry preserves the first syllable when typing directly into a selected cell.
          NOTES
          printf '\nSource commit: `%s`\n' "$BUILD_SHA" >> /tmp/grid-release-notes.md
          if gh release view "gridcraft-v$VERSION" --json isDraft --jq '.isDraft' > /tmp/grid-release-state; then
            test "$(cat /tmp/grid-release-state)" = true
            gh release edit "gridcraft-v$VERSION" --target "$BUILD_SHA" --title "Grid v$VERSION" --notes-file /tmp/grid-release-notes.md
          else
            gh release create "gridcraft-v$VERSION" --target "$BUILD_SHA" --title "Grid v$VERSION" --draft --notes-file /tmp/grid-release-notes.md
          fi
          gh release upload "gridcraft-v$VERSION" ./*.dmg ./*.msi ./*.zip SHA256SUMS.txt GridUpdate.json GridUpdate.sig --clobber
