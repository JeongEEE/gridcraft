[package]
name = "gridcraft-update"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Authenticated updates for the personal Grid fork"

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft-update = { git = "https://github.com/storytold/craft-libs", rev = "e98299546f5c5c3c22388d16507f8b5e61a5f280", version = "=0.1.0" }
serde.workspace = true
serde_json.workspace = true
ring = "=0.17.14"
zip.workspace = true
tempfile = "3"


[target.'cfg(unix)'.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["signal"] }

[target.'cfg(windows)'.dependencies]
winreg = "=0.55.0"
